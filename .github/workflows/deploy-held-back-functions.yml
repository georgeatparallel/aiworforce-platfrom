# DEPLOY A PINNED RELEASE OF THE LEAD V2 EDGE FUNCTIONS — manual, production.
#
# Release 86ac1b92 — run-agent AND pilot-chat: PR #63, Lead V2 termination,
# continuation state and mission consistency (Query B canary d22d9ee6, which
# looped for 29 minutes after useful discovery was exhausted), plus PR #61's
# mission-compilation fix, which never reached pilot-chat.
#
# run-agent    e2e8014e (v272) → 86ac1b92. e2e8014e..86ac1b92 changes
#              leadCapabilityEngine, leadAutoContinuation, leadMissionCancellation,
#              leadMissionTerminal, leadMissionWorkerCore, lineageProgressGuard,
#              retryTransient, buildStamp and run-agent/index.ts (plus worker/,
#              not deployed here). Released: an unproductive re-plan with no page
#              left exhausts discovery (`replan_unproductive`); companies screened
#              out at discovery are not progress; lineage progress is the maximum
#              of the task row, the lineage state and the queue count, and every
#              result write is guarded and reports itself; phase timings; the
#              slice-end claim and lineage releases retry a transient failure.
#              DEPLOYED.
# pilot-chat   b51ad3dd (v205) → 86ac1b92. It COMPILES missions, and production
#              still compiles with b51ad3dd: "with open sales roles" compiles to
#              no hiring requirement and "posted sales jobs" to an employee's
#              social post (PR #61's fix, in missionSignalDescriptor / signalKinds).
#              Measured with `deno info --json` and by what pilot-chat EXECUTES:
#              it bundles twelve modules changed since b51ad3dd, but its own
#              entry points into them — compileFirstProviderCall,
#              roleFamilyAliases, classifyRoleFamily, withBuildStamp — are
#              byte-identical; hiringActorInputs only gained code; the
#              roleFamilies change is title matching (roleMatchesFamily), which
#              pilot-chat does not call. The one behaviour that changes is mission
#              compilation's reading of hiring wording. DEPLOYED.
#
# NOT in this release (they stay on b51ad3dd, checked before and after):
#   orchestrate, enqueue-lead-mission, continue-workflow, resume-stalled-leads
#                bundle the signal readers and role families but do not compile
#                missions; left held, as in every Lead V2 release since b51ad3dd.
# Also bundling changed modules and NOT deployed, as in every Lead V2 release:
# run-monitoring-scan, unlock-founders, generate-company-brain-draft,
# daily-brief, run-lead-action, setup-company-brain. They report no build
# header, so they are not checked by build here.
# The three functions on a08ac0e4 stay there (checked before and after).
# THE WORKER runs the Lead V2 queue in-process (it bundles run-agent and the
# changed modules), so queued missions run this release only once a worker runs
# 86ac1b92. Railway is DOWN (trial expired) and the temporary local worker is
# STOPPED; the queue is idle. The post-deploy health step does not check the
# Railway worker; the worker is started from 86ac1b92 and verified separately.
# No database migration: nothing here touches the database.
#
# ROLLBACK: the step "Back up the currently deployed function" downloads the
# LIVE source of run-agent AND pilot-chat before anything changes, encrypts it with
# ROLLBACK_ARCHIVE_KEY and uploads it as the artifact
# `pre-deploy-functions-<run_id>` (30 days). To roll back: download the
# artifact, `openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ROLLBACK_ARCHIVE_KEY`
# it, untar, and `supabase --workdir <dir> functions deploy <run-agent|pilot-chat>
# --project-ref ohsdatpvfdjdemstoiuj --use-docker`.
# Nothing here rolls back automatically: a failed step stops the job and prints
# which functions are on which build.
#
# run-agent is too large for Supabase's server-side bundler (HTTP 413), so this
# bundles on the runner with Docker (`--use-docker`).
#
# It deploys ONLY commit RELEASE_SHA, whichever commit this file lives on.
# Secrets: SUPABASE_ACCESS_TOKEN and ROLLBACK_ARCHIVE_KEY from the `production`
# GitHub Environment; OPS_HEALTH_URL, OPS_HEALTH_TOKEN, WORKER_HEALTH_URL (the
# existing ops-health secrets). No provider key; no provider call; no canary.
#
# THIS REPOSITORY IS PUBLIC: logs and artifacts are world-readable. Nothing here
# prints a secret, and the pre-deploy backup is encrypted before upload.
name: Deploy held-back functions (production)

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Type the release SHA to deploy: 86ac1b92"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production-functions
  cancel-in-progress: false

env:
  RELEASE_SHA: 86ac1b922f8519f75760642bb09cceef096168eb
  # The release the three untouched a08ac0e4 functions still run; the preflight
  # proves the build check works by reading one of them back.
  PREVIOUS_RELEASE_SHA: a08ac0e4edea6f3aa54314db4efe0073e371b82f
  # The release the other lead-path functions run, and keep running, through
  # this deploy (b51ad3dd, PR #54, deployed 2026-10-11 06:46 UTC).
  HELD_RELEASE_SHA: b51ad3dddf2604f9d218d7c495e17e22d20932db
  # What the deployed functions run BEFORE this deploy. The preflight refuses if
  # either has moved, so this never overwrites a build nobody backed up on purpose.
  # run-agent: e2e8014e, v272, PR #61, deployed 2026-10-12 13:20 UTC.
  LIVE_RUN_AGENT_SHA: e2e8014e916ba2502bc61e4c8529e23e8890ea8a
  LIVE_RUN_AGENT_VERSION: "272"
  # pilot-chat: b51ad3dd, v205, PR #54, deployed 2026-10-11 06:46 UTC.
  LIVE_PILOT_CHAT_SHA: b51ad3dddf2604f9d218d7c495e17e22d20932db
  LIVE_PILOT_CHAT_VERSION: "205"
  DEPLOYED_FUNCTIONS: "run-agent pilot-chat"
  # Lead-path functions this deploy must NOT touch, with the build each runs.
  UNTOUCHED_ON_HELD: "orchestrate enqueue-lead-mission continue-workflow resume-stalled-leads"
  UNTOUCHED_ON_PREVIOUS: "ops-health approve-and-continue send-scheduled-emails"
  PROJECT_REF: ohsdatpvfdjdemstoiuj
  SUPABASE_URL: https://ohsdatpvfdjdemstoiuj.supabase.co

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - name: Confirm the release SHA
        env:
          CONFIRM: ${{ inputs.confirm_sha }}
        run: |
          if [ "$CONFIRM" != "86ac1b92" ]; then echo "::error::confirm_sha must be 86ac1b92"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          ref: 86ac1b922f8519f75760642bb09cceef096168eb
          # Full history, so the ancestry check below is never defeated by a
          # shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checkout is exactly the release commit, and it is on launch/hardening
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          git cat-file -e "$RELEASE_SHA^{commit}"
          # The release must be the merged, CI-tested launch/hardening history,
          # never a commit that only exists on some other branch.
          git fetch --no-tags --quiet origin launch/hardening
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD \
            || { echo "::error::$RELEASE_SHA is not on launch/hardening"; exit 1; }
          echo "checked out $RELEASE_SHA, clean, on launch/hardening"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Write the build verifier
        run: |
          cat > "$RUNNER_TEMP/expect-build.sh" <<'EOF'
          #!/usr/bin/env bash
          # expect-build.sh <function> [sha]: its x-agentory-build header must name
          # the sha (default RELEASE_SHA).
          set -uo pipefail
          fn="$1"
          want="${2:-$RELEASE_SHA}"
          for i in $(seq 1 20); do
            got="$(curl -sS -o /dev/null -D - -X OPTIONS "$SUPABASE_URL/functions/v1/$fn" \
              -H 'Origin: https://agentory.invalid' -H 'Access-Control-Request-Method: POST' \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="x-agentory-build"{print $2}')"
            case "$got" in "$want@"*) echo "$fn: $got"; exit 0 ;; esac
            echo "$fn: attempt $i saw '${got:-no header}', retrying"
            sleep 6
          done
          echo "::error::$fn does not report $want"
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/expect-build.sh"

      - name: Preflight — verification works, the live builds are the expected ones, JWT is on
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # A function this deploy does not touch must read back as the previous
          # release, or the post-deploy checks below could not prove anything.
          "$RUNNER_TEMP/expect-build.sh" approve-and-continue "$PREVIOUS_RELEASE_SHA"
          # The held-back functions must be on the previous pinned release now,
          # so the after-check can prove this deploy left them alone.
          for fn in $UNTOUCHED_ON_HELD; do
            "$RUNNER_TEMP/expect-build.sh" "$fn" "$HELD_RELEASE_SHA"
          done
          # The function about to be replaced must be EXACTLY what was measured
          # and is about to be backed up: build stamp, version number, JWT on.
          # Only `.version` and `.verify_jwt` are read from the Management API.
          check_live() {
            fn="$1"; sha="$2"; version="$3"
            "$RUNNER_TEMP/expect-build.sh" "$fn" "$sha"
            meta="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$fn" | jq -c '{version, verify_jwt}')"
            echo "$meta" | jq -e '.verify_jwt == true' > /dev/null \
              || { echo "::error::$fn does not currently have verify_jwt=true"; exit 1; }
            echo "$meta" | jq -e --arg v "$version" '(.version | tostring) == $v' > /dev/null \
              || { echo "::error::$fn is not on the expected version v$version: $meta"; exit 1; }
            echo "$fn: v$version, verify_jwt=true (before)"
          }
          check_live run-agent "$LIVE_RUN_AGENT_SHA" "$LIVE_RUN_AGENT_VERSION"
          check_live pilot-chat "$LIVE_PILOT_CHAT_SHA" "$LIVE_PILOT_CHAT_VERSION"

      - name: Precondition — FIRECRAWL_USD_PER_CREDIT exists (name only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Only the NAME column is kept; no value or digest is printed.
          names="$(supabase secrets list --project-ref "$PROJECT_REF" | awk -F'|' '{gsub(/[[:space:]]/, "", $1); print $1}')"
          if printf '%s\n' "$names" | grep -qx FIRECRAWL_USD_PER_CREDIT; then
            echo "FIRECRAWL_USD_PER_CREDIT: present"
          else
            echo "::error::FIRECRAWL_USD_PER_CREDIT is not set on Supabase — configure it before deploying"
            exit 1
          fi

      - name: Back up the currently deployed function (encrypted)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ROLLBACK_ARCHIVE_KEY: ${{ secrets.ROLLBACK_ARCHIVE_KEY }}
        run: |
          test -n "$ROLLBACK_ARCHIVE_KEY" || { echo "::error::ROLLBACK_ARCHIVE_KEY is not set"; exit 1; }
          # Its own workdir: `functions download` writes supabase/functions/<fn>,
          # which must never land on the release checkout.
          mkdir -p "$RUNNER_TEMP/rollback/supabase"
          cp supabase/config.toml "$RUNNER_TEMP/rollback/supabase/config.toml"
          # Downloaded quietly: the source is encrypted, never echoed to the
          # (public) log.
          for fn in $DEPLOYED_FUNCTIONS; do
            supabase --workdir "$RUNNER_TEMP/rollback" functions download "$fn" --project-ref "$PROJECT_REF" > /dev/null
            find "$RUNNER_TEMP/rollback" -path "*$fn*" -name index.ts | grep -q . \
              || { echo "::error::backup of $fn has no index.ts"; exit 1; }
            echo "$fn: backed up"
          done
          tar -czf - -C "$RUNNER_TEMP/rollback" . \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ROLLBACK_ARCHIVE_KEY -out "$RUNNER_TEMP/pre-deploy-functions.tgz.enc"
          sudo rm -rf "$RUNNER_TEMP/rollback"

      - uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-functions-${{ github.run_id }}
          path: ${{ runner.temp }}/pre-deploy-functions.tgz.enc
          retention-days: 30
          if-no-files-found: error

      - name: Stamp the build with the release SHA
        run: scripts/deploy/stamp-build.sh stamp

      # Two functions in this release: the edge copy of the Lead V2 engine, and
      # pilot-chat, which compiles missions. orchestrate stays on b51ad3dd.
      - name: Deploy run-agent (1 of 2)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TARGET: production
        run: node scripts/supabase-target.mjs production -- functions deploy run-agent --use-docker

      - name: Verify run-agent
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          "$RUNNER_TEMP/expect-build.sh" run-agent
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/run-agent" | jq -e '.verify_jwt == true' > /dev/null
          echo "run-agent: verify_jwt=true (after)"

      - name: Deploy pilot-chat (2 of 2)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_TARGET: production
        run: node scripts/supabase-target.mjs production -- functions deploy pilot-chat --use-docker

      - name: Verify pilot-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          "$RUNNER_TEMP/expect-build.sh" pilot-chat
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/pilot-chat" | jq -e '.verify_jwt == true' > /dev/null
          echo "pilot-chat: verify_jwt=true (after)"

      - name: Untouched functions are still on their existing build
        run: |
          for fn in $UNTOUCHED_ON_HELD; do
            "$RUNNER_TEMP/expect-build.sh" "$fn" "$HELD_RELEASE_SHA"
          done
          for fn in $UNTOUCHED_ON_PREVIOUS; do
            "$RUNNER_TEMP/expect-build.sh" "$fn" "$PREVIOUS_RELEASE_SHA"
          done

      - name: Production SHA report
        env:
          WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
        run: |
          AGENTORY_API_URL="${WORKER_HEALTH_URL%/health}" scripts/deploy/production-shas.sh

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.2

      - name: Queue state (Lead V2) — nothing stuck, nothing unclaimed
        env:
          OPS_HEALTH_URL: ${{ secrets.OPS_HEALTH_URL }}
          OPS_HEALTH_TOKEN: ${{ secrets.OPS_HEALTH_TOKEN }}
        run: |
          # Only the queue counters are printed; the token is sent as a header
          # and never echoed.
          queue="$(curl -fsS -H "x-ops-token: $OPS_HEALTH_TOKEN" "$OPS_HEALTH_URL" | jq -c '.snapshot.queue')"
          echo "queue: $queue"
          echo "$queue" | jq -e '.stuck_running == 0 and .unclaimed_waiting == 0' > /dev/null \
            || { echo "::error::the Lead V2 queue has stuck or unclaimed missions"; exit 1; }

      # RAILWAY IS DOWN FOR THIS RELEASE (trial expired; the temporary local
      # worker is stopped and the queue is idle), so the worker is deliberately
      # NOT checked here: `check-health.ts` reads an unreachable worker as
      # critical and would fail the job after a successful deploy. Without
      # WORKER_HEALTH_URL it logs "the worker is not checked"; ops-health and
      # the queue gate above still run. The worker is verified separately when
      # it is started from RELEASE_SHA.
      - name: Ops health (fails on warnings too; Railway worker not checked — down)
        env:
          OPS_HEALTH_URL: ${{ secrets.OPS_HEALTH_URL }}
          OPS_HEALTH_TOKEN: ${{ secrets.OPS_HEALTH_TOKEN }}
        run: deno run --allow-net --allow-env scripts/ops/check-health.ts --fail-on warn

      - name: On failure — where every function stands (no automatic rollback)
        if: failure()
        env:
          WORKER_HEALTH_URL: ${{ secrets.WORKER_HEALTH_URL }}
        run: |
          AGENTORY_API_URL="${WORKER_HEALTH_URL%/health}" scripts/deploy/production-shas.sh || true
          echo "::warning::Deploy stopped. Functions above that report $RELEASE_SHA were deployed; the rest were not."
          echo "::warning::Roll back from artifact pre-deploy-functions-${{ github.run_id }} (see the header of this workflow)."
